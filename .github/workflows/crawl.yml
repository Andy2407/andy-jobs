name: Jobsuche Crawl v3

on:
  schedule:
    - cron: "0 4,8,12,16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r crawler/requirements.txt
      - name: Run crawler
        working-directory: crawler
        run: python crawler.py
      - name: Commit & push
        env:
          NOW: ${{ github.run_started_at }}
        run: |
          git config user.name "Crawler Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.js data.json index.html jobsuche_standalone.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine Aenderungen"
          else
            git commit -m "data: cloud crawl v3 $NOW"
            git push
          fi
