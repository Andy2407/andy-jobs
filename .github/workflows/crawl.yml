name: Jobsuche Crawl v7

on:
  schedule:
    - cron: "0 4,8,12,16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r crawler/requirements.txt
      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium
      - name: Run crawler v2 (25 Quellen inkl. SII/Rodenstock/CARIAD/MTU)
        working-directory: crawler
        run: python crawler_v2.py
      - name: Commit and push with rebase
        env:
          NOW: ${{ github.run_started_at }}
        run: |
          set -euo pipefail
          git config user.name "Crawler Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.js data.json index.html jobsuche_standalone.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine Aenderungen"
          else
            git commit -m "data: cloud crawl v7 ${NOW}"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && break || sleep 5
            done
          fi

