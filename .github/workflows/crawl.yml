name: Jobsuche Crawl v7

on:
  schedule:
    - cron: "0 4,8,12,16 * * *"
  workflow_dispatch: {}

# FIX 2026-06-11: Parallele Laeufe zerschossen sich gegenseitig den Daten-Push
# (Rebase-Konflikt in data.json -> "success" ohne Deploy, Andy sah 14:19-Stand).
# Laeufe werden ab jetzt serialisiert; ein laufender Crawl wird nie abgebrochen.
concurrency:
  group: crawl-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r crawler/requirements.txt
      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium
      - name: Run crawler v2 (25 Quellen inkl. SII/Rodenstock/CARIAD/MTU)
        working-directory: crawler
        run: python crawler_v2.py
      - name: Encrypt dashboards (StaticCrypt)
        run: npx --yes staticrypt@3.5.4 index.html jobsuche_standalone.html -p "$STATICRYPT_PASSWORD" --short -d .
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
      - name: Commit and push (konfliktfrei + verifiziert)
        run: |
          set -euo pipefail
          # FIX: github.run_started_at existiert nicht im github-Kontext (Commit-Messages
          # waren deshalb ohne Timestamp) -> echten UTC-Zeitstempel selbst setzen.
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git config user.name "Crawler Bot"
          git config user.email "bot@users.noreply.github.com"
          # FIX 2026-06-11: pull --rebase konfligierte in data.json und liess den
          # Lauf als "success" enden, obwohl NICHTS deployt wurde. Neue Strategie:
          # frische Daten sichern -> hart auf origin/main -> Daten drueberlegen ->
          # committen -> pushen (Retry). Konfliktfrei per Konstruktion.
          mkdir -p /tmp/crawlout
          cp data.js data.json index.html jobsuche_standalone.html /tmp/crawlout/
          PUSHED=0
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/crawlout/data.js /tmp/crawlout/data.json /tmp/crawlout/index.html /tmp/crawlout/jobsuche_standalone.html .
            git add data.js data.json index.html jobsuche_standalone.html
            if git diff --cached --quiet; then
              echo "Keine Aenderungen gegenueber origin"
              PUSHED=1
              break
            fi
            git commit -m "data: cloud crawl v7 ${NOW}"
            if git push origin main; then
              echo "PUSH OK (Versuch $i)"
              PUSHED=1
              break
            fi
            echo "Push-Kollision, Versuch $i — neuer Anlauf"
            sleep $((i * 5))
          done
          # Deploy-Verifikation: Lauf darf NIE "success" melden, wenn nichts live ging
          if [ "$PUSHED" -ne 1 ]; then
            echo "::error::Daten wurden NICHT gepusht — Lauf schlaegt laut fehl"
            exit 1
          fi
          git fetch origin main
          if git diff --quiet origin/main -- data.js data.json index.html jobsuche_standalone.html; then
            echo "PUSH VERIFIZIERT: alle 4 Dashboard-Dateien sind auf origin/main"
          else
            echo "::error::Push unvollstaendig — Dashboard-Dateien weichen von origin/main ab"
            exit 1
          fi

      # NEU 2026-08-06: Der Schritt oben belegt nur, dass die Dateien IM REPO liegen —
      # nicht, dass GitHub Pages sie ausliefert. Genau diese Verwechslung fuehrte am
      # 06.08. dazu, dass die Live-Seite stundenlang auf dem Stand von 10:30 festhing,
      # waehrend im Repo laengst neue Daten lagen und jeder Lauf "success" meldete.
      # Ab jetzt wird die AUSGELIEFERTE data.js geprueft, nicht die gepushte.
      # Keine Fremd-Eingaben im Skript: feste URL + eigener Zeitstempel aus data.json.
      - name: Live-Auslieferung verifizieren (Pages)
        run: |
          set -uo pipefail
          SOLL="$(python3 -c "import json;print(json.load(open('data.json'))['generated_at'])")"
          echo "Erwarteter Stand auf der Live-Seite: $SOLL"
          URL="https://andy2407.github.io/andy-jobs/data.js"
          for i in $(seq 1 30); do
            IST="$(curl -fsSL --max-time 25 "$URL" 2>/dev/null | python3 -c "import sys,re;t=sys.stdin.read();m=re.search(r'\"generated_at\":\s*\"([^\"]+)\"',t);print(m.group(1) if m else '')" 2>/dev/null || echo "")"
            if [ "$IST" = "$SOLL" ]; then
              echo "LIVE VERIFIZIERT nach $((i*20))s — die Seite liefert $IST"
              exit 0
            fi
            echo "  Versuch $i/30: live steht noch auf '${IST:-nicht lesbar}'"
            sleep 20
          done
          echo "::error::Pages liefert nach 10 Minuten weiterhin nicht den neuen Stand ($SOLL)."
          echo "::error::Daten sind im Repo, aber NICHT beim Nutzer."
          exit 1

